<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感冒记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f4f8;
    color: #1a1a2e;
    max-width: 480px; margin: 0 auto; padding: 20px;
    min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 24px 0 8px; }
  .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }

  /* Action buttons */
  .actions { display: flex; gap: 12px; margin-bottom: 24px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 16px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.96); }
  .btn-record {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,.35);
  }
  .btn-record:active { box-shadow: 0 2px 6px rgba(239,68,68,.35); }
  .btn-clear {
    background: #e2e8f0; color: #475569;
  }
  .btn-clear:active { background: #cbd5e1; }
  .btn-export {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,.35);
  }

  /* Stats cards */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: #fff; border-radius: 12px; padding: 16px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .stat-card .num { font-size: 32px; font-weight: 700; color: #ef4444; }
  .stat-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }

  /* Year stats */
  .year-section { margin-bottom: 20px; }
  .year-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #334155; }
  .year-bar {
    background: #e2e8f0; border-radius: 8px; height: 24px; overflow: hidden;
    position: relative;
  }
  .year-fill {
    height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, #fca5a5, #ef4444);
    transition: width .3s;
    display: flex; align-items: center; padding-left: 8px;
    font-size: 12px; font-weight: 600; color: #fff; min-width: fit-content;
  }
  .year-fill span { padding-left: 4px; }

  /* Record list */
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #334155; }
  .record-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .record-item {
    background: #fff; border-radius: 10px; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    animation: fadeIn .3s ease;
  }
  .record-item .date { font-size: 15px; font-weight: 500; }
  .record-item .weekday { font-size: 13px; color: #64748b; margin-left: 8px; }
  .record-item .del {
    background: none; border: none; color: #94a3b8; font-size: 18px;
    cursor: pointer; padding: 4px; line-height: 1; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .record-item .del:hover { color: #ef4444; background: #fef2f2; }

  .empty { text-align: center; color: #94a3b8; padding: 32px 0; font-size: 15px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 24px; border-radius: 8px;
    font-size: 14px; font-weight: 500; z-index: 999;
    animation: fadeInDown .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<h1>😷 感冒记录</h1>
<p class="subtitle">点一下按钮就记一次，看看频率变化</p>

<div class="actions">
  <button class="btn btn-record" id="btn-record">🤧 记一次感冒</button>
  <button class="btn btn-clear" id="btn-clear">清空</button>
</div>

<div class="stats">
  <div class="stat-card" id="stat-total"><div class="num">0</div><div class="label">总次数</div></div>
  <div class="stat-card" id="stat-this-year"><div class="num">0</div><div class="label">今年</div></div>
  <div class="stat-card" id="stat-last-year"><div class="num">0</div><div class="label">去年</div></div>
</div>

<div id="year-stats"></div>

<div class="section-title">历史记录</div>
<ul class="record-list" id="record-list"></ul>
<div class="empty" id="empty-msg">还没有记录，加油保持健康 💪</div>

<div class="actions" style="margin-top:auto;padding-top:16px">
  <button class="btn btn-export" id="btn-export">📋 导出数据</button>
</div>

<script>
const STORAGE_KEY = 'sickness-records';

function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function weekday(dateStr) {
  const days = ['日','一','二','三','四','五','六'];
  return '周' + days[new Date(dateStr).getDay()];
}

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function recordSickness() {
  const today = todayStr();
  const records = getRecords();
  if (records.includes(today)) {
    showToast('今天已经记过了 🫡');
    return;
  }
  records.push(today);
  saveRecords(records);
  render();
  showToast('已记录 🤧 多喝热水');
}

function clearAll() {
  if (!confirm('确定清空所有感冒记录吗？')) return;
  saveRecords([]);
  render();
  showToast('已清空');
}

function deleteRecord(date) {
  let records = getRecords();
  records = records.filter(r => r !== date);
  saveRecords(records);
  render();
}

function render() {
  const records = getRecords();
  records.sort((a, b) => b.localeCompare(a)); // newest first

  // Stats
  const total = records.length;
  const thisYear = new Date().getFullYear();
  const thisYearCount = records.filter(r => r.startsWith(String(thisYear))).length;
  const lastYearCount = records.filter(r => r.startsWith(String(thisYear - 1))).length;

  document.getElementById('stat-total').querySelector('.num').textContent = total;
  document.getElementById('stat-this-year').querySelector('.num').textContent = thisYearCount;
  document.getElementById('stat-last-year').querySelector('.num').textContent = lastYearCount;

  // Year stats bar
  const yearStatsEl = document.getElementById('year-stats');
  const byYear = {};
  for (const r of records) {
    const y = r.slice(0, 4);
    byYear[y] = (byYear[y] || 0) + 1;
  }
  const years = Object.keys(byYear).sort().reverse();
  const maxCount = Math.max(...Object.values(byYear), 1);
  let yearHtml = '';
  for (const y of years) {
    const pct = (byYear[y] / maxCount * 100).toFixed(0);
    yearHtml += `<div class="year-section">
      <div class="year-title">${y} 年 · ${byYear[y]} 次</div>
      <div class="year-bar"><div class="year-fill" style="width:${pct}%"><span>${byYear[y]}次</span></div></div>
    </div>`;
  }
  yearStatsEl.innerHTML = yearHtml;

  // Record list
  const listEl = document.getElementById('record-list');
  const emptyEl = document.getElementById('empty-msg');
  if (total === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = records.map(r => `
    <li class="record-item">
      <span><span class="date">${r}</span><span class="weekday">${weekday(r)}</span></span>
      <button class="del" onclick="deleteRecord('${r}')">✕</button>
    </li>
  `).join('');
}

// Export
document.getElementById('btn-export').addEventListener('click', () => {
  const records = getRecords();
  if (records.length === 0) { showToast('没有数据可导出'); return; }
  const text = '感冒记录\n' + records.sort().map(r => r + ' ' + weekday(r)).join('\n');
  navigator.clipboard.writeText(text).then(
    () => showToast('已复制到剪贴板'),
    () => { // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      showToast('已复制到剪贴板');
    }
  );
});

// Event listeners
document.getElementById('btn-record').addEventListener('click', recordSickness);
document.getElementById('btn-clear').addEventListener('click', clearAll);

render();
</script>
</body>
</html>
